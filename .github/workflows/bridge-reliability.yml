name: Bridge reliability
on:
  pull_request:
    paths: ['ops/agent-bridge/**', '.github/workflows/**', 'tests/test_agent_bridge.py']
  push:
    branches: ['master']
    paths: ['ops/agent-bridge/**', '.github/workflows/**', 'tests/test_agent_bridge.py']
permissions:
  contents: read
concurrency:
  group: bridge-reliability-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  bridge-reliability:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify checkout isolation, gates, and task authorization
        run: python -m unittest discover -s ops/agent-bridge -p test_reliability.py -v
