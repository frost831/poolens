name: Android bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: [self-hosted, mac, codex]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build unsigned release bundle
        working-directory: android-twa
        run: bash ./gradlew bundleRelease --no-daemon
      - name: Upload unsigned bundle
        uses: actions/upload-artifact@v4
        with:
          name: splashlens-android-unsigned-v11
          path: android-twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
