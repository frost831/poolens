name: Agent Bridge

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Existing frost831-authored issue number
        required: true
        type: string
      machine:
        description: Target machine
        required: true
        type: choice
        options: [mac, pc]

permissions:
  contents: read

jobs:
  mac:
    if: >-
      contains(fromJSON('["frost831/throttleshare","frost831/poolens"]'), github.repository) &&
      github.event.sender.login == 'frost831' &&
      (github.event_name == 'workflow_dispatch' && inputs.machine == 'mac' ||
       github.event.issue.user.login == 'frost831' && !github.event.issue.pull_request &&
       contains(github.event.issue.labels.*.name, 'agent:mac') &&
       !contains(github.event.issue.labels.*.name, 'agent:pc') &&
       !contains(github.event.issue.labels.*.name, 'agent:running') &&
       (github.event_name == 'issues' && (github.event.action == 'opened' || github.event.label.name == 'agent:mac') ||
        github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/codex')))
    runs-on: [self-hosted, mac, codex]
    timeout-minutes: 180
    concurrency:
      group: ${{ github.repository }}-agent-mac
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run authorized Mac task
        shell: bash
        env:
          AGENT_MACHINE: mac
        run: python3 ops/agent-bridge/run.py

  pc:
    if: >-
      contains(fromJSON('["frost831/throttleshare","frost831/poolens","frost831/poolens-site"]'), github.repository) &&
      github.event.sender.login == 'frost831' &&
      (github.event_name == 'workflow_dispatch' && inputs.machine == 'pc' ||
       github.event.issue.user.login == 'frost831' && !github.event.issue.pull_request &&
       contains(github.event.issue.labels.*.name, 'agent:pc') &&
       !contains(github.event.issue.labels.*.name, 'agent:mac') &&
       !contains(github.event.issue.labels.*.name, 'agent:running') &&
       (github.event_name == 'issues' && (github.event.action == 'opened' || github.event.label.name == 'agent:pc') ||
        github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/codex')))
    runs-on: [self-hosted, pc, codex, agent]
    timeout-minutes: 180
    concurrency:
      group: ${{ github.repository }}-agent-pc
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run authorized PC task
        shell: pwsh
        env:
          AGENT_MACHINE: pc
        run: python ops/agent-bridge/run.py
