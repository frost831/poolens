<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>SplashLens Service Proof Packet</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #edf7fb; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(860px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 42px; }
    .shell { background: #fff; border: 1px solid #cfe2ec; border-radius: 10px; overflow: hidden; box-shadow: 0 18px 48px rgba(15, 23, 42, .12); }
    header { background: #082f49; color: #fff; padding: 22px; }
    .kicker { color: #7dd3fc; font-size: 11px; font-weight: 950; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 46px); line-height: 1; letter-spacing: 0; }
    .sub { margin: 10px 0 0; color: #cbd5e1; font-size: 14px; line-height: 1.45; }
    .content { padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .metric, .section { border: 1px solid #dbe8ef; border-radius: 8px; background: #f8fafc; padding: 13px; }
    .metric b { display: block; color: #0369a1; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
    .metric span { display: block; color: #0f172a; font-size: 16px; font-weight: 900; overflow-wrap: anywhere; }
    .section { margin-bottom: 12px; }
    .section h2 { margin: 0 0 8px; color: #075985; font-size: 15px; }
    .section p, .section li { color: #334155; font-size: 14px; line-height: 1.5; }
    .pill { display: inline-flex; border-radius: 999px; padding: 4px 9px; font-size: 11px; font-weight: 900; background: #e0f2fe; color: #075985; margin: 0 6px 6px 0; }
    .warn { background: #fff7ed; border-color: #fed7aa; }
    .warn h2 { color: #9a3412; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button, a.button { min-height: 42px; border: 0; border-radius: 8px; background: #0369a1; color: #fff; padding: 0 14px; font: inherit; font-weight: 900; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
    button.secondary, a.secondary { background: #e2e8f0; color: #334155; }
    @media print { body { background: #fff; } main { width: 100%; padding: 0; } .shell { box-shadow: none; border: 0; } .actions { display: none; } }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } header, .content { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <div class="shell" id="packet-shell">
      <header>
        <div class="kicker">SplashLens Service Proof Packet</div>
        <h1 id="title">Loading packet</h1>
        <p class="sub">Reference-only documentation for a pool/spa service stop. Verify repairs, part fit, chemical safety, and code requirements with manuals, labels, manufacturer guidance, and qualified service judgment.</p>
      </header>
      <div class="content" id="content"></div>
    </div>
  </main>
  <script>
    function esc(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }
    function decodePayload() {
      const raw = new URLSearchParams(location.search).get('p') || '';
      if (!raw) throw new Error('Missing packet data.');
      const padded = raw.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - raw.length % 4) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }
    function row(label, value) {
      return `<div class="metric"><b>${esc(label)}</b><span>${esc(value || '-')}</span></div>`;
    }
    function render() {
      let packet;
      try {
        packet = decodePayload();
      } catch (err) {
        document.getElementById('title').textContent = 'Packet unavailable';
        document.getElementById('content').innerHTML = `<div class="section warn"><h2>Could not open this packet</h2><p>${esc(err.message || 'The packet link is invalid.')}</p></div>`;
        return;
      }
      document.getElementById('title').textContent = `${packet.customer || 'Customer'} - ${packet.visitType || 'Service visit'}`;
      const readings = packet.readings || {};
      const proof = packet.proof || {};
      const risk = packet.callbackRisk || {};
      const chemicals = Array.isArray(packet.chemicals) ? packet.chemicals : [];
      document.getElementById('content').innerHTML = `
        <div class="grid">
          ${row('Visit Date', packet.date)}
          ${row('Tech', packet.tech)}
          ${row('Proof Status', proof.complete ? 'Proof ready' : 'Needs proof')}
          ${row('Customer', packet.customer)}
          ${row('Address', packet.address)}
          ${row('Callback Risk', risk.level || 'unknown')}
        </div>
        <section class="section"><h2>Customer Summary</h2><p>${esc(proof.customerSummary || 'No customer summary included.')}</p></section>
        <section class="section"><h2>Water Readings</h2><p>${['fc','cc','ph','ta','ch','cya'].map(k => `${k.toUpperCase()}: ${readings[k] || '-'}`).join(' | ')} ${readings.source ? ' | Source: ' + esc(readings.source) : ''}</p></section>
        <section class="section"><h2>Stop Proof</h2>
          ${proof.photoProof ? `<p><strong>Photos/proof:</strong> ${esc(proof.photoProof)}</p>` : ''}
          ${proof.issueNote ? `<p><strong>Tech note:</strong> ${esc(proof.issueNote)}</p>` : ''}
          ${proof.missing && proof.missing.length ? `<p><strong>Missing before final decision:</strong> ${proof.missing.map(esc).join(', ')}</p>` : '<p>No missing proof listed.</p>'}
        </section>
        ${chemicals.length ? `<section class="section"><h2>Chemicals</h2><ul>${chemicals.map(item => `<li>${esc(item.name)}${item.amount ? ' - ' + esc(item.amount) : ''}</li>`).join('')}</ul></section>` : ''}
        ${packet.workPerformed ? `<section class="section"><h2>Work Performed</h2><p>${esc(packet.workPerformed)}</p></section>` : ''}
        ${packet.equipmentNotes ? `<section class="section"><h2>Equipment Notes</h2><p>${esc(packet.equipmentNotes)}</p></section>` : ''}
        ${packet.recommendations ? `<section class="section"><h2>Recommendations</h2><p>${esc(packet.recommendations)}</p></section>` : ''}
        ${packet.nextVisit ? `<section class="section"><h2>Next Visit</h2><p>${esc(packet.nextVisit)}</p></section>` : ''}
        ${risk.flags && risk.flags.length ? `<section class="section warn"><h2>Risk / Trend Flags</h2><ul>${risk.flags.map(flag => `<li>${esc(flag)}</li>`).join('')}</ul></section>` : ''}
        <section class="section warn"><h2>Important</h2><p>${esc(packet.disclaimer || 'Reference only. Verify all decisions with qualified service judgment.')}</p></section>
        <div class="actions"><button onclick="window.print()">Print / PDF</button><a class="button secondary" href="/">Open SplashLens</a></div>
      `;
    }
    render();
  </script>
</body>
</html>
