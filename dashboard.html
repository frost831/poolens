<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>SplashLens Owner Dashboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #eef7fb;
      color: #0f172a;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      color: #075985;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1;
      letter-spacing: 0;
    }
    .sub {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.45;
    }
    .auth {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      background: #fff;
      border: 1px solid #cfe2ec;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .06);
    }
    input {
      width: 100%;
      min-height: 40px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      padding: 9px 11px;
      color: #0f172a;
      font: inherit;
      font-size: 14px;
    }
    button {
      min-height: 40px;
      border: 0;
      border-radius: 7px;
      background: #0369a1;
      color: #fff;
      padding: 0 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    button.secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .status {
      margin-bottom: 16px;
      color: #475569;
      font-size: 13px;
      min-height: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .metric, .panel {
      background: #fff;
      border: 1px solid #cfe2ec;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .06);
    }
    .metric {
      padding: 14px;
      min-height: 112px;
    }
    .label {
      color: #64748b;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 10px;
    }
    .value {
      color: #0f172a;
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .hint {
      margin-top: 8px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.35;
    }
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .panel {
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      padding: 13px 14px;
      border-bottom: 1px solid #e2e8f0;
      color: #075985;
      font-size: 15px;
      letter-spacing: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid #eef2f7;
      text-align: left;
      vertical-align: top;
    }
    th {
      color: #64748b;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .07em;
    }
    td:last-child, th:last-child {
      text-align: right;
    }
    .events td:last-child, .events th:last-child {
      text-align: left;
    }
    code {
      color: #0f172a;
      background: #f1f5f9;
      border-radius: 5px;
      padding: 2px 5px;
      font-size: 12px;
    }
    @media (max-width: 820px) {
      header, .auth, .panels { grid-template-columns: 1fr; display: grid; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      main { width: min(100% - 20px, 1120px); padding-top: 18px; }
      .grid { grid-template-columns: 1fr; }
      th, td { padding: 9px 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>SplashLens Dashboard</h1>
        <p class="sub">Owner view for real app usage: opens, installs, scans, searches, and recent events. This does not track email opens.</p>
      </div>
      <form class="auth" id="auth-form">
        <input id="secret" type="password" autocomplete="current-password" placeholder="Stats/admin secret">
        <button type="submit">Load</button>
        <button class="secondary" type="button" id="forget">Forget</button>
      </form>
    </header>

    <div class="status" id="status">Enter your stats secret to load current usage.</div>

    <section class="grid" id="metrics"></section>

    <section class="panels">
      <div class="panel">
        <h2>Top Events</h2>
        <table id="top-events"></table>
      </div>
      <div class="panel">
        <h2>Manual Searches</h2>
        <table id="manual-queries"></table>
      </div>
      <div class="panel">
        <h2>Scan Modes</h2>
        <table id="scan-modes"></table>
      </div>
      <div class="panel">
        <h2>Top Paths</h2>
        <table id="top-paths"></table>
      </div>
      <div class="panel" style="grid-column:1/-1;">
        <h2>Recent Events</h2>
        <table class="events" id="recent-events"></table>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'splashlens-dashboard-secret';
    const statusEl = document.getElementById('status');
    const secretEl = document.getElementById('secret');
    const saved = localStorage.getItem(STORAGE_KEY) || '';
    if (saved) secretEl.value = saved;

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? '#b91c1c' : '#475569';
    }

    function metricCard(label, value, hint) {
      return `<div class="metric"><div class="label">${label}</div><div class="value">${Number(value || 0).toLocaleString()}</div><div class="hint">${hint || ''}</div></div>`;
    }

    function renderCountTable(id, rows, nameLabel) {
      const el = document.getElementById(id);
      const body = (rows || []).map((row) => `<tr><td><code>${escapeHtml(row.name || 'unknown')}</code></td><td>${Number(row.count || 0).toLocaleString()}</td></tr>`).join('');
      el.innerHTML = `<thead><tr><th>${nameLabel}</th><th>Count</th></tr></thead><tbody>${body || '<tr><td colspan="2">No events yet.</td></tr>'}</tbody>`;
    }

    function renderRecent(rows) {
      const el = document.getElementById('recent-events');
      const body = (rows || []).map((row) => {
        const props = row.props ? JSON.stringify(row.props).slice(0, 180) : '';
        return `<tr><td>${new Date(row.createdAt).toLocaleString()}</td><td><code>${escapeHtml(row.event || '')}</code></td><td>${escapeHtml(row.path || '')}</td><td>${escapeHtml(props)}</td></tr>`;
      }).join('');
      el.innerHTML = '<thead><tr><th>Time</th><th>Event</th><th>Path</th><th>Props</th></tr></thead><tbody>' + (body || '<tr><td colspan="4">No events yet.</td></tr>') + '</tbody>';
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    async function loadDashboard() {
      const secret = secretEl.value.trim();
      if (!secret) {
        setStatus('Enter your stats secret to load current usage.', true);
        return;
      }
      localStorage.setItem(STORAGE_KEY, secret);
      setStatus('Loading current usage...', false);

      const response = await fetch('/api/events?summary=1&limit=750', {
        headers: { Authorization: `Bearer ${secret}` },
        cache: 'no-store'
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) {
        setStatus(data.error || `Dashboard load failed: HTTP ${response.status}`, true);
        return;
      }

      const m = data.metrics || {};
      document.getElementById('metrics').innerHTML = [
        metricCard('App Opens 7d', m.appOpens7d, 'Real app usage, not email opens.'),
        metricCard('App Opens 30d', m.appOpens30d, 'Anonymous event count.'),
        metricCard('PWA Installs 30d', m.installs30d, 'Browser-dependent install signal.'),
        metricCard('AI Scans 30d', m.scans30d, 'Scanner starts.'),
        metricCard('Manual Searches 30d', m.searches30d, 'Error/code lookup searches.'),
        metricCard('PartSnap Results 30d', m.partsnapResults30d, 'Possible part-result screens.'),
        metricCard('Events 7d', m.events7d, 'All stored app events.'),
        metricCard('Stored Events', m.storedEvents, 'Loaded from KV sample.')
      ].join('');
      renderCountTable('top-events', data.topEvents, 'Event');
      renderCountTable('manual-queries', data.manualQueries, 'Query');
      renderCountTable('scan-modes', data.scanModes, 'Mode');
      renderCountTable('top-paths', data.topPaths, 'Path');
      renderRecent(data.recentEvents);
      setStatus(`Loaded ${Number(m.storedEvents || 0).toLocaleString()} stored events. Generated ${new Date(data.generatedAt).toLocaleString()}.`, false);
    }

    document.getElementById('auth-form').addEventListener('submit', (event) => {
      event.preventDefault();
      loadDashboard().catch((err) => setStatus(err.message || 'Dashboard load failed.', true));
    });
    document.getElementById('forget').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      secretEl.value = '';
      setStatus('Secret removed from this browser.', false);
    });
    if (saved) loadDashboard().catch(() => {});
  </script>
</body>
</html>
